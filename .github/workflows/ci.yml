# CI gates: API lint/types/tests/schema drift, web lint/types/tests/build/types drift,
# end-to-end (Playwright) and Lighthouse against the prod compose profile.
# Versions: Python 3.14 and Node 26 match api/Dockerfile and web/Dockerfile;
# Postgres 19 matches the db service in docker-compose.yml.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:19.0-alpine
        env:
          POSTGRES_DB: ledger
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledger"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      POSTGRES_HOST: localhost
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: api/requirements*.txt
      - name: Install dependencies
        run: pip install -r api/requirements-dev.txt
      - name: Ruff check
        working-directory: api
        run: ruff check .
      - name: Ruff format check
        working-directory: api
        run: ruff format --check .
      - name: Mypy
        working-directory: api
        run: mypy .
      - name: Pytest
        working-directory: api
        run: pytest -q
      - name: Export OpenAPI schema
        working-directory: api
        run: python manage.py spectacular --file schema.yml --validate
      - name: Schema drift
        run: git diff --exit-code api/schema.yml
      - name: pip-audit (production deps)
        working-directory: api
        run: pip-audit -r requirements.txt

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Biome
        working-directory: web
        run: npx biome check src
      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit
      - name: Vitest
        working-directory: web
        run: npx vitest run
      - name: Build
        working-directory: web
        run: npm run build
      - name: npm audit (production deps)
        working-directory: web
        run: npm audit --omit=dev
      - name: Types drift
        working-directory: web
        run: |
          npx openapi-typescript ../api/schema.yml -o src/api/schema.d.ts
          git diff --exit-code src/api/schema.d.ts

  e2e:
    name: e2e
    needs: [api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Start prod profile
        run: docker compose --profile prod up -d --build api_prod web_prod
      - name: Wait for web and vendor
        run: |
          curl -fsS --retry 60 --retry-delay 2 --retry-all-errors -o /dev/null http://localhost:8081
          curl -fsS --retry 60 --retry-delay 2 --retry-all-errors -o /dev/null http://localhost:8080/health
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: web
        run: npx playwright test
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
      - name: Compose logs
        if: failure()
        run: docker compose --profile prod logs --no-color --timestamps
      - name: Tear down
        if: always()
        run: docker compose --profile prod down -v

  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Start prod profile
        run: docker compose --profile prod up -d --build api_prod web_prod
      - name: Wait for web and vendor
        run: |
          curl -fsS --retry 60 --retry-delay 2 --retry-all-errors -o /dev/null http://localhost:8081
          curl -fsS --retry 60 --retry-delay 2 --retry-all-errors -o /dev/null http://localhost:8080/health
      - name: Install root tooling (pinned @lhci/cli)
        run: npm ci
      - name: Lighthouse CI
        run: npx --no-install lhci autorun
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci
          if-no-files-found: ignore
      - name: Compose logs
        if: failure()
        run: docker compose --profile prod logs --no-color --timestamps
      - name: Tear down
        if: always()
        run: docker compose --profile prod down -v
