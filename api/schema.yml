components:
  schemas:
    Category:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        schedule_c_line:
          type: string
          nullable: true
        deductible_fraction:
          type: number
          format: double
        kind:
          $ref: '#/components/schemas/CategoryKindEnum'
      required:
      - deductible_fraction
      - key
      - kind
      - label
      - schedule_c_line
    CategoryBreakdown:
      type: object
      properties:
        category:
          type: string
          nullable: true
        label:
          type: string
        spend_cents:
          type: integer
        count:
          type: integer
      required:
      - category
      - count
      - label
      - spend_cents
    CategoryKindEnum:
      enum:
      - income
      - transfer
      - personal
      - expense
      type: string
      description: |-
        * `income` - income
        * `transfer` - transfer
        * `personal` - personal
        * `expense` - expense
    CategoryList:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Category'
      required:
      - results
    DbEnum:
      enum:
      - ok
      - error
      type: string
      description: |-
        * `ok` - ok
        * `error` - error
    DirectionEnum:
      enum:
      - debit
      - credit
      type: string
      description: |-
        * `debit` - debit
        * `credit` - credit
    Error:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
      - error
    ErrorBody:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
      required:
      - code
      - message
      - request_id
    Flags:
      type: object
      properties:
        tax-set-aside:
          type: boolean
        auth-required:
          type: boolean
        merchant-rules:
          type: boolean
        category-suggestions:
          type: boolean
      required:
      - auth-required
      - category-suggestions
      - merchant-rules
      - tax-set-aside
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/HealthStatusEnum'
        db:
          $ref: '#/components/schemas/DbEnum'
        vendor:
          $ref: '#/components/schemas/VendorEnum'
      required:
      - db
      - status
      - vendor
    HealthStatusEnum:
      enum:
      - ok
      - degraded
      type: string
      description: |-
        * `ok` - ok
        * `degraded` - degraded
    History:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/HistoryEvent'
      required:
      - results
    HistoryEvent:
      type: object
      properties:
        at:
          type: string
          format: date-time
        actor:
          type: string
        action:
          type: string
        before:
          nullable: true
        after:
          nullable: true
      required:
      - action
      - actor
      - after
      - at
      - before
    LoginRequestRequest:
      type: object
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 256
      required:
      - email
      - password
    LoginResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        idle_timeout_seconds:
          type: integer
      required:
      - idle_timeout_seconds
      - user
    Me:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        idle_timeout_seconds:
          type: integer
        expires_in_seconds:
          type: integer
      required:
      - expires_in_seconds
      - idle_timeout_seconds
      - user
    MerchantRule:
      type: object
      properties:
        id:
          type: integer
        merchant:
          type: string
        category:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - category
      - created_at
      - id
      - merchant
    MerchantRuleCreated:
      type: object
      properties:
        rule:
          $ref: '#/components/schemas/MerchantRule'
        applied_count:
          type: integer
      required:
      - applied_count
      - rule
    MerchantRuleList:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/MerchantRule'
      required:
      - results
    MerchantRuleRequestRequest:
      type: object
      properties:
        merchant:
          type: string
