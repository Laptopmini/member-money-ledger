# Dev stack: `docker compose up --build`.
# Prod-like stack: `docker compose --profile prod up --build` (adds api_prod + web_prod on :8081).
# Do not edit vendor/. It stands in for a third-party service.

x-api-env: &api-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-placeholder-not-a-secret}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
  # Vite dev server origin; the browser sends Origin: http://localhost:5173 on writes.
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:5173}
  VENDOR_URL: ${VENDOR_URL:-http://vendor:8080}
  POSTGRES_DB: ${POSTGRES_DB:-ledger}
  POSTGRES_USER: ${POSTGRES_USER:-ledger}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledger}
  POSTGRES_HOST: ${POSTGRES_HOST:-db}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  FLAGD_HOST: ${FLAGD_HOST:-flagd}
  FLAGD_PORT: ${FLAGD_PORT:-8013}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}

x-db-depends: &db-healthy
  db:
    condition: service_healthy

services:
  # Ledgerly, the bank-data vendor. Treat it as a third party: do not edit vendor/.
  vendor:
    build: ./vendor
    ports:
      - "8080:8080"

  db:
    image: postgres:19.0-alpine
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      - "5433:5432"
    volumes:
      # PG 18+ images want the mount one level up. New volume name: the old `pgdata` holds PG 16 data.
      - pgdata19:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger"]
      interval: 2s
      retries: 15

  flagd:
    image: ghcr.io/open-feature/flagd:v0.19.0
    command: ["start", "--uri", "file:/etc/flagd/flags.json"]
    volumes:
      - ./flags:/etc/flagd:ro
    ports:
      - "8013:8013" # gRPC
      - "8016:8016" # OFREP (HTTP)

  api:
    build: ./api
    env_file:
      - path: .env
        required: false
    environment: *api-env
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    depends_on:
      <<: *db-healthy
      vendor:
        condition: service_started
      flagd:
        condition: service_started

  # Polls the vendor and mirrors rows into Postgres. Same image as api.
  # Shared by the dev and prod stacks. The command is added in the backend stage.
  sync_worker:
    build: ./api
    command: ["python", "manage.py", "sync_ledgerly", "--loop", "--interval", "30"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment: *api-env
    volumes:
      - ./api:/app
    depends_on:
      <<: *db-healthy
      vendor:
        condition: service_started

  web:
    build:
      context: ./web
      target: dev
    environment:
      API_URL: ${API_URL:-http://api:8000}
      FLAGD_URL: http://flagd:8016
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      # Named volume, not an anonymous one: deps survive rebuilds, and the entrypoint
      # re-runs `npm ci` when package-lock.json changes.
      - web_node_modules:/app/node_modules
      - ./api/schema.yml:/api/schema.yml:ro  # make types: openapi-typescript reads ../api/schema.yml
    depends_on:
      - api
      - flagd

  # ---- prod profile: gunicorn + built web behind Caddy ----

  api_prod:
    profiles: ["prod"]
    build:
      context: ./api
      args:
        DEV: "0"
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && exec gunicorn config.wsgi -w 3 -b 0.0.0.0:8000
    environment:
      <<: *api-env
      DJANGO_DEBUG: "0"
      DJANGO_SECURE_COOKIES: "0"  # the prod profile serves plain HTTP on :8081; set to 1 behind TLS
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8081
      # Demo-only seeded member for the local prod profile; never set a default in real prod.
      DEMO_MEMBER_PASSWORD: ${DEMO_MEMBER_PASSWORD:-demo-password-2026}
      # Caddy is the only way in (api_prod only exposes 8000), so X-Forwarded-For is trustworthy here.
      TRUST_PROXY: "1"
    expose:
      - "8000"
    depends_on:
      <<: *db-healthy
      vendor:
        condition: service_started
      flagd:
        condition: service_started

  web_prod:
    profiles: ["prod"]
    build:
      context: ./web
      target: prod
    ports:
      - "8081:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api_prod
      - flagd

volumes:
  pgdata19:
  web_node_modules:
